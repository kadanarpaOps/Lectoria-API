server:
  port: ${PORT:8080}

spring:
  application:
    name: Lectoria-API
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_REALM_ISSUER}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH}
          starttls:
            enable: ${MAIL_ENABLE_TLS}
        connectiontimeout: ${MAIL_TIMEOUT}
        timeout: ${MAIL_TIMEOUT}
        writetimeout: ${MAIL_TIMEOUT}

keycloak:
  server:
    url: ${KEYCLOAK_SERVER_URL}
  client:
    id: ${KEYCLOAK_CLIENT_ID}
    secret: ${KEYCLOAK_CLIENT_SECRET}
  realm: ${KEYCLOAK_REALM}
  auth:
    url:
      login: ${KEYCLOAK_AUTH_LOGIN_URL}
      logout: ${KEYCLOAK_AUTH_LOGOUT_URL}
      introspection: ${KEYCLOAK_AUTH_INTROSPECTION_URL}
  skip:
    defaultrole: ${KEYCLOAK_SKIP_ROLE}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME_SPRING}
  api_key: ${CLOUDINARY_API_KEY_SPRING}
  api_secret: ${CLOUDINARY_API_SECRET_SPRING}

view:
  url: ${VIEW_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v1/api-docs

environment: ${ENVIRONMENT}

frontend:
  url: ${FRONTEND_URL}

cookie:
  config:
    site: ${COOKIE_SITE_CONFIG}
    secure: ${COOKIE_SECURE_CONFIG}

data:
  seeder:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
    admin-email: ${ADMIN_EMAIL}

logging:
  pattern:
    dateformat: hh:mm
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
