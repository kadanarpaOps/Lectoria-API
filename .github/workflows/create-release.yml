name: Create Release
on:
  workflow_dispatch:

jobs:
  call-create-release:
    name: Create Release
    permissions:
      contents: write
    uses: kadanarpaOps/Ops-Github-Workflows/.github/workflows/create-release.yml@main
    secrets:
      BOT_CLIENT_ID: ${{ secrets.BOT_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
